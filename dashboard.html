<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - BlackOps Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

  :root {
    --neon: #00ff7f;
    --neon-dim: rgba(0, 255, 127, 0.25);
    --bg: #050505;
    --card: rgba(255, 255, 255, 0.04);
    --card-border: rgba(0, 255, 127, 0.18);
    --text-dim: #9a9a9a;
  }

  body {
    background: radial-gradient(circle at 20% 0%, #0c1a12 0%, #050505 45%);
    color: #fff;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(5,5,5,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
  }
  .brand span.dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon), 0 0 16px var(--neon);
  }
  .bell {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    position: relative;
  }
  .bell::after {
    content: "";
    position: absolute;
    top: 8px; right: 9px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 6px #ff4d4d;
  }

  .wrap { padding: 20px; max-width: 480px; margin: 0 auto; }

  .hero {
    background: linear-gradient(135deg, rgba(0,255,127,0.10), rgba(0,255,127,0.02));
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  .hero::before {
    content: "";
    position: absolute;
    width: 160px; height: 160px;
    background: var(--neon);
    opacity: 0.10;
    filter: blur(50px);
    top: -60px; right: -40px;
    border-radius: 50%;
  }
  .hero-label { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
  .hero-name { font-size: 24px; font-weight: 800; color: var(--neon); }
  .hero-sub { margin-top: 10px; font-size: 13px; color: var(--text-dim); }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }
  .stat .val { font-size: 17px; font-weight: 800; color: var(--neon); }
  .stat .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title a { color: var(--neon); font-size: 12px; text-decoration: none; font-weight: 600; }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .menu-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 14px;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    animation: fadeUp 0.5s ease both;
  }
  .menu-card:active { transform: scale(0.97); }
  .menu-card:hover { border-color: var(--neon); box-shadow: 0 0 18px rgba(0,255,127,0.15); }
  .menu-card .icon { font-size: 24px; }
  .menu-card .title { font-size: 14px; font-weight: 700; }
  .menu-card .desc { font-size: 11px; color: var(--text-dim); }

  .games {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
    overflow-x: auto;
  }
  .game-chip {
    flex: 0 0 auto;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    min-width: 120px;
    animation: fadeUp 0.5s ease both;
  }
  .game-chip .g-icon { font-size: 26px; margin-bottom: 6px; }
  .game-chip .g-name { font-size: 13px; font-weight: 700; }
  .game-chip .g-tag { font-size: 10px; color: var(--neon); margin-top: 2px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--card-border);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    z-index: 30;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 10px;
    background: none;
    border: none;
  }
  .nav-item.active { color: var(--neon); }
  .nav-item .n-icon { font-size: 19px; }

  .msg { text-align: center; color: var(--text-dim); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> BlackOps Arena</div>
  <button class="bell" onclick="alert('Notifications coming soon!')">🔔</button>
</div>

<div class="wrap">

   <div class="hero" style="text-align:center; padding: 32px 20px;">
    <img src="logo-horizontal.png" alt="BlackOps Arena" style="width:240px; max-width:100%; height:auto; filter: drop-shadow(0 0 18px rgba(212,178,58,0.35)) drop-shadow(0 0 30px rgba(8,145,178,0.2));">
  </div>
  <div class="stats">
    <div class="stat"><div class="val">0</div><div class="lbl">Matches</div></div>
    <div class="stat"><div class="val">0</div><div class="lbl">Wins</div></div>
    <div class="stat"><div class="val">₹0</div><div class="lbl">Wallet</div></div>
  </div>

  <div class="section-title">Popular Games</div>
  <div class="games">
    <div class="game-chip">
      <div class="g-icon">🎯</div>
      <div class="g-name">BGMI</div>
      <div class="g-tag">Live</div>
    </div>
    <div class="game-chip">
      <div class="g-icon">🔥</div>
      <div class="g-name">Free Fire MAX</div>
      <div class="g-tag">Live</div>
    </div>
  </div>

  <div class="section-title">
    Quick Access
  </div>
  <div class="menu-grid">
    <a href="tournaments.html" class="menu-card">
      <div class="icon">🏆</div>
      <div class="title">Tournaments</div>
      <div class="desc">Join & compete</div>
    </a>
    <a href="#" class="menu-card" onclick="alert('Leaderboard coming soon!'); return false;">
      <div class="icon">🥇</div>
      <div class="title">Leaderboard</div>
      <div class="desc">Top players</div>
    </a>
    <a href="#" class="menu-card" onclick="alert('Wallet coming soon!'); return false;">
      <div class="icon">💰</div>
      <div class="title">Wallet</div>
      <div class="desc">Add & withdraw</div>
    </a>
    <a href="profile.html" class="menu-card">
      <div class="icon">👤</div>
      <div class="title">My Profile</div>
      <div class="desc">Stats & settings</div>
    </a>
  </div>

  <div class="msg" id="authMsg"></div>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item active"><span class="n-icon">🏠</span>Home</a>
  <a href="tournaments.html" class="nav-item"><span class="n-icon">🏆</span>Tournaments</a>
  <a href="#" class="nav-item" onclick="alert('Wallet coming soon!'); return false;"><span class="n-icon">💰</span>Wallet</a>
  <a href="profile.html" class="nav-item"><span class="n-icon">👤</span>Profile</a>
  <button class="nav-item" onclick="logoutUser()"><span class="n-icon">🚪</span>Logout</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4Dx0-YaFzspPqRh0gqINFqOQCl1GDgIA",
    authDomain: "blackops-arena.firebaseapp.com",
    projectId: "blackops-arena",
    storageBucket: "blackops-arena.firebasestorage.app",
    messagingSenderId: "942341854858",
    appId: "1:942341854858:web:f56a9cf0374304aaa03f73"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("playerName").textContent = user.displayName || "Player";
    } else {
      window.location.href = "login.html";
    }
  });

  window.logoutUser = function () {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };
</script>

</body>
</html>
