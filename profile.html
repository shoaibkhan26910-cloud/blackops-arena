<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 align="center">👤 Player Profile</h1>

<form>

<label>Full Name</label><br>
<input type="text" placeholder="Enter Full Name"><br><br>

<label>Email</label><br>
<input type="email" placeholder="Enter Email"><br><br>

<label>Mobile Number</label><br>
<input type="text" placeholder="Enter Mobile"><br><br>

<label>BGMI UID</label><br>
<input type="text" placeholder="Enter BGMI UID"><br><br>

<label>Free Fire UID</label><br>
<input type="text" placeholder="Enter Free Fire UID"><br><br>

<label>Team Name</label><br>
<input type="text" placeholder="Enter Team Name"><br><br>

<button type="submit">Save Profile</button>

</form>

<script src="script.js"></script>

</body>
</html>
